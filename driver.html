<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NZILA Driver V2</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#101715;color:#edf7f2;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#18211e;border:1px solid #2a3832;border-radius:20px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input{width:100%;padding:13px;border:1px solid #3b4b44;border-radius:12px;background:#101715;color:white;margin:5px 0 11px}button{border:0;border-radius:12px;padding:13px 17px;font-weight:800;cursor:pointer}.primary{background:#39c78a;color:#062116;width:100%}.ghost{background:#293630;color:white}.danger{background:#d04444;color:white;width:100%}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#9eafa8}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#193e31;color:#6de0ad;font-weight:800;font-size:12px}.hidden{display:none}#map{height:360px;border-radius:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav button{background:#202c27;color:white}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div id="auth" class="card" style="max-width:520px;margin:6vh auto"><h1>NZILA DRIVER</h1><p class="muted">Votre numéro +242 est votre identifiant.</p><input id="first" placeholder="Prénom"><input id="last" placeholder="Nom"><input id="phone" placeholder="+242 Votre numéro"><input id="pass" type="password" placeholder="Mot de passe"><input id="license" placeholder="Numéro de permis"><div class="grid"><input id="make" placeholder="Marque"><input id="model" placeholder="Modèle"></div><div class="grid"><input id="plate" placeholder="Plaque"><input id="color" placeholder="Couleur"></div><button class="primary" onclick="signup()">Déposer ma candidature</button><hr><input id="lphone" placeholder="+242 Votre numéro"><input id="lpass" type="password" placeholder="Mot de passe"><button class="ghost" onclick="login()">Se connecter</button><p id="msg" class="muted"></p></div>
<div id="app" class="hidden"><div class="row"><div><h1>NZILA DRIVER</h1><p id="hello" class="muted"></p></div><button class="ghost" onclick="logout()">Déconnexion</button></div><div class="nav"><button onclick="show('cockpit')">Cockpit</button><button onclick="show('rides')">Courses</button><button onclick="show('mapPage')">GPS</button><button onclick="show('profile')">Profil</button></div>
<section id="cockpit"><div class="grid"><div class="card"><span id="status" class="pill">HORS LIGNE</span><h2>Disponibilité</h2><p id="statusText" class="muted"></p><button id="onlineBtn" class="primary" onclick="toggleOnline()">Passer en ligne</button></div><div class="card"><h2>Course active</h2><div id="active">Aucune course active.</div></div></div><div id="offer" class="card hidden"><h2>Nouvelle demande</h2><div id="offerText"></div><div class="grid"><button class="primary" onclick="acceptOffer()">Accepter</button><button class="ghost" onclick="refuseOffer()">Refuser</button></div></div></section>
<section id="rides" class="hidden"><div class="card"><h2>Historique</h2><div id="rideList"></div></div></section><section id="mapPage" class="hidden"><div class="card"><h2>GPS temps réel</h2><div id="map"></div><p id="gps" class="muted"></p></div></section><section id="profile" class="hidden"><div class="card"><h2>Profil</h2><div id="profileBox"></div><button class="danger" onclick="sos()">SOS — Alerter NZILA</button></div></section></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://dsvbtlwxujuusnarcbfg.supabase.co';
const SUPABASE_KEY='sb_publishable_WYONr6ioYrczatDZGZk4LA_cJMxOJ8G';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SESSION_KEY='nzila_v2_session';
let session=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
function normPhone(v){let x=(v||'').replace(/\s+/g,'');if(/^0\d{9}$/.test(x))x='+242'+x.slice(1);if(/^242\d{9}$/.test(x))x='+'+x;return x}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(v){return Number(v||0).toLocaleString('fr-FR')+' FCFA'}
function setSession(x){session=x;localStorage.setItem(SESSION_KEY,JSON.stringify(x))}
function logout(){localStorage.removeItem(SESSION_KEY);location.reload()}
async function rpc(name,args){let r=await sb.rpc(name,args);if(r.error)throw r.error;return r.data}
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let map,marker,gpsWatch=null,offer=null,activeRide=null,offerSub;
function show(id){document.querySelectorAll('#app section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='rides')loadRides();if(id==='mapPage')setTimeout(()=>map.invalidateSize(),100);if(id==='profile')renderProfile()}
function note(t){msg.textContent=t}
async function signup(){try{let id=await rpc('nzila_register',{p_first_name:first.value.trim(),p_last_name:last.value.trim(),p_phone:normPhone(phone.value),p_password:pass.value,p_role:'client'});await rpc('submit_driver_application',{p_user_id:id,p_license:license.value,p_make:make.value,p_model:model.value,p_plate:plate.value,p_color:color.value});note('Candidature déposée. Attendez la validation NZILA.')}catch(e){note(e.message)}}
async function login(){try{let d=await rpc('nzila_login',{p_phone:normPhone(lphone.value),p_password:lpass.value});if(!d?.length)return note('Numéro ou mot de passe incorrect.');let u=d[0];if(u.role!=='driver')return note('Ce compte n’est pas un compte chauffeur.');setSession(u);location.reload()}catch(e){note(e.message)}}
async function toggleOnline(){try{let d=await rpc('set_driver_online_v2',{p_driver_id:session.id,p_online:!window.online});window.online=!!d.online;renderOnline();if(window.online){startGPS();watchOffers()}else stopGPS()}catch(e){alert(e.message)}}
function renderOnline(){status.textContent=window.online?'EN LIGNE':'HORS LIGNE';statusText.textContent=window.online?'Vous pouvez recevoir des demandes.':'Vous ne recevez pas de demandes.';onlineBtn.textContent=window.online?'Passer hors ligne':'Passer en ligne'}
function startGPS(){if(gpsWatch!==null||!navigator.geolocation)return;gps.textContent='GPS actif';gpsWatch=navigator.geolocation.watchPosition(async p=>{let c=p.coords;if(marker)marker.setLatLng([c.latitude,c.longitude]);else marker=L.marker([c.latitude,c.longitude]).addTo(map);try{await rpc('upsert_driver_location_v2',{p_driver_id:session.id,p_lat:c.latitude,p_lng:c.longitude,p_accuracy:c.accuracy,p_heading:c.heading,p_speed:c.speed})}catch(e){}},{enableHighAccuracy:true,maximumAge:3000,timeout:10000})}
function stopGPS(){if(gpsWatch!==null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null}gps.textContent='GPS inactif'}
async function loadOffer(){let r=await sb.from('rides').select('*').in('status',['searching','offered']).is('driver_id',null).order('created_at',{ascending:true}).limit(1);if(r.data?.[0]){offer=r.data[0];offerBox()}}
function offerBox(){offerText.innerHTML='<b>'+esc(offer.pickup_address)+'</b> → '+esc(offer.destination_address)+'<br>'+money(offer.estimated_price);document.getElementById('offer').classList.remove('hidden')}
async function watchOffers(){await loadOffer();if(offerSub)sb.removeChannel(offerSub);offerSub=sb.channel('driver-offers-'+session.id).on('postgres_changes',{event:'*',schema:'public',table:'rides'},()=>loadOffer()).subscribe()}
async function acceptOffer(){if(!offer)return;try{let r=await rpc('accept_ride_v2',{p_ride_id:offer.id,p_driver_id:session.id});activeRide=r;offer=null;document.getElementById('offer').classList.add('hidden');renderActive(r)}catch(e){alert(e.message);loadOffer()}}
function refuseOffer(){offer=null;document.getElementById('offer').classList.add('hidden')}
function renderActive(r){activeRide=r||null;if(!r){active.textContent='Aucune course active.';return}let next={accepted:'driver_arriving',driver_arriving:'arrived',arrived:'in_progress',in_progress:'completed'}[r.status];active.innerHTML='<b>'+esc(r.status)+'</b><br>'+esc(r.pickup_address)+' → '+esc(r.destination_address)+'<br><button class="primary" onclick="nextStatus(\''+next+'\')">'+(next==='driver_arriving'?'Prendre la course':next==='arrived'?'Je suis arrivé':next==='in_progress'?'Démarrer la course':'Terminer la course')+'</button>'}
async function nextStatus(s){try{let r=await rpc('update_ride_status_v2',{p_ride_id:activeRide.id,p_driver_id:session.id,p_status:s});renderActive(r)}catch(e){alert(e.message)}}
async function loadRides(){let r=await sb.from('rides').select('*').eq('driver_id',session.id).order('created_at',{ascending:false}).limit(30);rideList.innerHTML=r.data?.length?r.data.map(x=>'<div class="card"><b>'+esc(x.status)+'</b><br>'+esc(x.pickup_address)+' → '+esc(x.destination_address)+'<br>'+money(x.final_price??x.estimated_price)+'</div>').join(''):'Aucune course'}
function renderProfile(){profileBox.innerHTML='<b>'+esc(session.first_name||'Chauffeur')+' '+esc(session.last_name||'')+'</b><br>'+esc(session.phone||'')}
async function sos(){try{let p=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:5000}):no());let id=await rpc('trigger_driver_sos_v2',{p_driver_id:session.id,p_ride_id:activeRide?.id||null,p_lat:p.coords.latitude,p_lng:p.coords.longitude});alert('SOS NZILA enregistré : '+id)}catch(e){alert('SOS : '+e.message)}}
window.addEventListener('load',async()=>{if(session?.role==='driver'){auth.classList.add('hidden');app.classList.remove('hidden');hello.textContent='Bonjour '+(session.first_name||'chauffeur')+' 👋';map=L.map('map').setView([-4.2634,15.2429],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);let r=await sb.from('driver_profiles').select('*').eq('id',session.id).maybeSingle();window.online=!!r.data?.online;renderOnline();if(window.online){startGPS();watchOffers()}let ar=await sb.from('rides').select('*').eq('driver_id',session.id).in('status',['accepted','driver_arriving','arrived','in_progress']).order('created_at',{ascending:false}).limit(1);renderActive(ar.data?.[0])}})
</script></body></html>
